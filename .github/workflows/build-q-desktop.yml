name: Build and Deploy Quintuplet DE (Q Desktop)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Build Arch Linux (Blue / Vergil) Package
  # ------------------------------------------------------------------
  build-arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Arch Mirror & Toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja pacman-contrib wget

      - name: Build PKGBUILD
        run: |
          # Create non-root user for makepkg (makepkg refuses to run as root)
          useradd builder -m
          chown -R builder:builder .
          su builder -c "cd arch && makepkg -sc --noconfirm"

      - name: Generate Arch Repository DB
        run: |
          mkdir -p dist/arch
          mv arch/*.pkg.tar.zst dist/arch/
          cd dist/arch
          repo-add q-desktop.db.tar.gz *.pkg.tar.zst

      - name: Upload Arch Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arch-dist
          path: dist/arch/

  # ------------------------------------------------------------------
  # JOB 2: Build Debian (Red / Dante) Package
  # ------------------------------------------------------------------
  build-debian:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Source Repositories & Install Build Chain
        run: |
          # Enable source repos so we can fetch KDE build dependencies
          echo "deb-src http://deb.debian.org/debian bookworm main" >> /etc/apt/sources.list
          apt-get update
          apt-get install -y build-essential devscripts dpkg-dev apt-utils git cmake ninja-build wget fakeroot
          # MAGIC TRICK: Automatically fetch all 100+ KDE Plasma build dependencies
          apt-get build-dep -y plasma-desktop
          
      - name: Download Plasma 5.27 Source
        run: |
          wget https://download.kde.org/stable/plasma/5.27.11/plasma-desktop-5.27.11.tar.xz
          tar -xf plasma-desktop-5.27.11.tar.xz
          # Inject our custom debian packaging into the upstream source tree
          cp -r debian plasma-desktop-5.27.11/
          
      - name: Build Debian Package
        run: |
          # Run dpkg-buildpackage from the SOURCE ROOT, not inside the debian folder
          cd plasma-desktop-5.27.11
          dpkg-buildpackage -us -uc -b
          cd ..
          mkdir -p dist/debian
          mv *.deb dist/debian/ || true
          
      - name: Generate Debian Index
        run: |
          cd dist/debian
          dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz
          
      - name: Upload Debian Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-dist
          path: dist/debian/

  # ------------------------------------------------------------------
  # JOB 3: Deploy Packages to SourceForge
  # ------------------------------------------------------------------
  deploy-sourceforge:
    needs: [build-arch, build-debian]
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Configure SSH and Deploy
        env:
          SF_KEY: ${{ secrets.SF_SSH_KEY }}
          SF_USER: ${{ secrets.SF_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          # Write the ED25519 private key to the SSH directory
          echo "$SF_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts
          
          # Sync Arch Repo to SourceForge
          rsync -avP --delete artifacts/arch-dist/ $SF_USER@frs.sourceforge.net:/home/frs/project/q-desktop/arch/
          # Sync Debian Repo to SourceForge
          rsync -avP --delete artifacts/debian-dist/ $SF_USER@frs.sourceforge.net:/home/frs/project/q-desktop/debian/
